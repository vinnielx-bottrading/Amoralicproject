<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Tracker — Dashboard theo dõi dự án</title>
<style>
  :root{
    color-scheme: light;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --blue: #2a78d6;
    --orange: #eb6834;
    --aqua: #1baf7a;
    --yellow: #eda100;
    --magenta: #e87ba4;
    --green: #008300;
    --violet: #4a3aa7;
    --red: #e34948;
    --good: #0ca30c;
    --warning: #c98500;
    --warning-bg: #fab21922;
    --serious: #ec835a;
    --critical: #d03b3b;
    --sidebar-w: 244px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; font-size:14px; }
  button{ cursor:pointer; }
  a{ color:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--baseline); border-radius:6px; }

  /* ---------- Layout ---------- */
  #app{ min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width: var(--sidebar-w); flex:0 0 auto; background:var(--surface);
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid var(--border); }
  .brand-mark{ width:30px;height:30px;border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--violet)); flex:0 0 auto; }
  .brand-text{ font-weight:700; font-size:15px; line-height:1.2; }
  .brand-sub{ font-size:11px; color:var(--muted); }
  .nav{ padding:10px; display:flex; flex-direction:column; gap:2px; flex:1 1 auto; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    color:var(--text-2); text-decoration:none; border:none; background:transparent; text-align:left; width:100%;
    font-size:14px; font-weight:500;
  }
  .nav-item:hover{ background:var(--page); color:var(--text); }
  .nav-item.active{ background:#2a78d614; color:var(--blue); }
  .nav-icon{ width:18px; text-align:center; flex:0 0 auto; }
  .nav-sep{ margin:10px 4px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:0 8px; }
  .sidebar-foot{ border-top:1px solid var(--border); padding:12px; display:flex; align-items:center; gap:10px; }
  .avatar{
    width:32px;height:32px;border-radius:50%; background:var(--blue); color:#fff; display:flex;
    align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto;
  }
  .foot-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot-role{ font-size:11px; color:var(--muted); }
  .logout-btn{ margin-left:auto; border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:6px 9px; font-size:12px; color:var(--text-2); }
  .logout-btn:hover{ background:var(--page); }

  .main{ flex:1 1 auto; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 26px;
    border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:18px; margin:0; font-weight:700; }
  .topbar .crumb{ font-size:12px; color:var(--muted); margin-top:2px; }
  .content{ padding:26px; max-width:1320px; }

  /* ---------- Buttons / inputs ---------- */
  .btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; }
  .btn:hover{ background:var(--page); }
  .btn-primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn-primary:hover{ background:#2166b8; }
  .btn-danger{ background:#fff; border-color:var(--critical); color:var(--critical); }
  .btn-danger:hover{ background:#d03b3b12; }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--page); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);
  }
  input:focus,textarea:focus,select:focus{ outline:2px solid #2a78d655; border-color:var(--blue); }
  label.field-label{ font-size:12px; font-weight:600; color:var(--text-2); display:block; margin:0 0 5px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ---------- Cards / badges ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:12px; font-weight:600; white-space:nowrap; }
  .dot{ width:7px;height:7px;border-radius:50%; flex:0 0 auto; }
  .progress-track{ height:7px; background:var(--grid); border-radius:100px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--blue); border-radius:100px; }

  /* due-soon glow */
  @keyframes glow-pulse{
    0%,100%{ box-shadow:0 0 0 0 #fab21966, 0 0 0 1px #fab219aa inset; }
    50%{ box-shadow:0 0 0 5px #fab21900, 0 0 0 1px #fab219aa inset; }
  }
  @keyframes glow-pulse-critical{
    0%,100%{ box-shadow:0 0 0 0 #d03b3b66, 0 0 0 1px #d03b3baa inset; }
    50%{ box-shadow:0 0 0 5px #d03b3b00, 0 0 0 1px #d03b3baa inset; }
  }
  .due-soon{ animation: glow-pulse 1.8s ease-in-out infinite; }
  .overdue-glow{ animation: glow-pulse-critical 1.8s ease-in-out infinite; }

  /* ---------- Login ---------- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:400px; padding:30px; }
  .login-title{ font-size:20px; font-weight:800; margin:2px 0 3px; }
  .login-sub{ font-size:13px; color:var(--muted); margin-bottom:22px; }
  .login-tabs{ display:flex; gap:4px; background:var(--page); padding:3px; border-radius:9px; margin-bottom:20px; }
  .login-tab{ flex:1; padding:7px; border-radius:7px; border:none; background:transparent; font-weight:600; font-size:13px; color:var(--text-2); }
  .login-tab.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 2px var(--border); }
  .demo-box{ margin-top:20px; padding:12px 14px; border-radius:9px; background:var(--page); border:1px solid var(--border); font-size:12px; color:var(--text-2); line-height:1.7; }
  .demo-box b{ color:var(--text); }
  .err-box{ background:#d03b3b12; border:1px solid #d03b3b44; color:var(--critical); padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; }

  /* ---------- Stat tiles ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi-tile{ padding:16px; }
  .kpi-label{ font-size:12px; color:var(--muted); font-weight:600; }
  .kpi-value{ font-size:26px; font-weight:800; margin-top:4px; font-variant-numeric: proportional-nums; }
  .kpi-value.warn{ color:var(--warning); }
  .kpi-value.crit{ color:var(--critical); }
  .kpi-value.good{ color:var(--good); }

  /* ---------- Project cards ---------- */
  .project-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .project-card{ padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; }
  .project-card:hover{ border-color:var(--baseline); }
  .project-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .project-card h3{ margin:0; font-size:15px; }
  .project-desc{ font-size:12.5px; color:var(--text-2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .project-meta-row{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--muted); }
  .member-stack{ display:flex; }
  .member-stack .avatar{ width:24px;height:24px; font-size:10px; margin-left:-8px; border:2px solid var(--surface); }
  .member-stack .avatar:first-child{ margin-left:0; }

  /* ---------- Tabs ---------- */
  .tabbar{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .tabbtn{ padding:9px 14px; border:none; background:transparent; font-weight:600; font-size:13.5px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabbtn.active{ color:var(--blue); border-bottom-color:var(--blue); }

  /* ---------- Task list / tree ---------- */
  .task-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--grid); }
  .task-row:hover{ background:var(--page); }
  .task-row .expand-btn{ width:18px; height:18px; flex:0 0 auto; border:none; background:transparent; color:var(--muted); }
  .task-title-wrap{ flex:1 1 auto; min-width:0; cursor:pointer; }
  .task-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task-sub-of{ font-size:11px; color:var(--muted); }
  .task-side{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .task-due{ font-size:12px; color:var(--text-2); padding:3px 8px; border-radius:100px; }
  .task-assignee{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-2); }
  .icon-btn{ border:none; background:transparent; color:var(--muted); padding:5px; border-radius:6px; }
  .icon-btn:hover{ background:var(--grid); color:var(--text); }
  .add-subtask-row{ padding:8px 12px 8px 44px; }
  .empty-hint{ padding:30px; text-align:center; color:var(--muted); font-size:13px; }

  /* ---------- Kanban ---------- */
  .kanban-wrap{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; }
  .kanban-col{ flex:0 0 260px; background:var(--page); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:200px; }
  .kanban-col.drag-over{ outline:2px dashed var(--blue); outline-offset:-2px; }
  .kanban-col-head{ display:flex; align-items:center; gap:8px; padding:4px 4px 10px; font-size:12.5px; font-weight:700; }
  .kanban-count{ margin-left:auto; font-size:11px; color:var(--muted); font-weight:600; background:var(--surface); border-radius:100px; padding:1px 7px; }
  .kanban-card{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px; margin-bottom:8px; cursor:grab; }
  .kanban-card:active{ cursor:grabbing; }
  .kanban-card-title{ font-size:12.5px; font-weight:700; margin-bottom:6px; line-height:1.35; }
  .kanban-card-foot{ display:flex; align-items:center; justify-content:space-between; gap:6px; }

  /* ---------- Gantt ---------- */
  .gantt-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  .gantt-grid{ position:relative; min-width:900px; }
  .gantt-header{ display:flex; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
  .gantt-month{ border-right:1px solid var(--grid); font-size:11px; color:var(--muted); padding:8px 6px; font-weight:600; }
  .gantt-body{ position:relative; }
  .gantt-row{ display:flex; align-items:center; height:36px; border-bottom:1px solid var(--grid); position:relative; }
  .gantt-row-label{ position:sticky; left:0; background:var(--surface); width:230px; flex:0 0 230px; padding:0 10px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--border); height:100%; display:flex; align-items:center; z-index:1; }
  .gantt-row-label.sub{ font-weight:500; color:var(--text-2); padding-left:22px; }
  .gantt-track{ position:relative; flex:1 1 auto; height:100%; }
  .gantt-bar{ position:absolute; top:7px; height:22px; border-radius:6px; min-width:8px; display:flex; align-items:center; padding:0 8px; font-size:10.5px; color:#fff; font-weight:700; white-space:nowrap; overflow:hidden; cursor:pointer; }
  .gantt-today{ position:absolute; top:0; bottom:0; width:2px; background:var(--critical); z-index:3; }
  .gantt-today-label{ position:absolute; top:-18px; font-size:10px; color:var(--critical); font-weight:700; transform:translateX(-50%); }

  /* ---------- Bar rows (stats) ---------- */
  .barrow{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .barrow-label{ width:150px; flex:0 0 auto; font-size:12.5px; color:var(--text-2); display:flex; align-items:center; gap:6px; font-weight:600; }
  .barrow-track{ flex:1 1 auto; height:9px; background:var(--grid); border-radius:100px; overflow:hidden; }
  .barrow-fill{ height:100%; border-radius:100px; }
  .barrow-value{ width:34px; flex:0 0 auto; text-align:right; font-size:12.5px; font-weight:700; font-variant-numeric: tabular-nums; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(11,11,11,0.42); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
  .modal{ width:100%; max-width:640px; padding:22px 24px 24px; margin-bottom:40px; }
  .modal-sm{ max-width:420px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head h2{ margin:0; font-size:16px; }
  .modal-close{ border:none; background:transparent; color:var(--muted); font-size:18px; padding:4px 8px; border-radius:6px; }
  .modal-close:hover{ background:var(--page); }
  .modal-sec-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:18px 0 8px; }
  .comment-item{ padding:9px 0; border-bottom:1px solid var(--grid); }
  .comment-head{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; margin-bottom:3px; }
  .comment-time{ font-weight:500; color:var(--muted); }
  .comment-body{ font-size:13px; color:var(--text-2); line-height:1.5; white-space:pre-wrap; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .modal-actions .spacer{ flex:1 1 auto; }

  .toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--text); color:#fff; padding:10px 16px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.2); }
  .toast.err{ background:var(--critical); }

  .members-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grid); }
  .members-row .name{ font-size:13px; font-weight:600; }
  .members-row .email{ font-size:11.5px; color:var(--muted); }
  .role-select{ width:auto; padding:5px 8px; font-size:12px; }

  .issue-item{ padding:10px 0; border-bottom:1px solid var(--grid); }
  .issue-item:last-child{ border-bottom:none; }
  .issue-title{ font-size:13px; font-weight:700; }
  .issue-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .section-title{ font-size:15px; font-weight:700; margin:0 0 12px; }
  .two-col{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 980px){ .two-col{ grid-template-columns:1fr; } }
  .pad{ padding:18px; }
  .toggle{ position:relative; width:38px; height:22px; border-radius:100px; background:var(--grid); border:none; flex:0 0 auto; }
  .toggle.on{ background:var(--blue); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on .knob{ left:18px; }

  @media (max-width: 860px){
    .sidebar{ display:none; }
    .content{ padding:16px; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================================
   PROJECT TRACKER DASHBOARD
   Single-file SPA backed by Supabase (Postgres + Auth + RLS).
   ========================================================================= */

const SUPABASE_URL = 'https://oapfplwvvspkvklldtpf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcGZwbHd2dnNwa3ZrbGxkdHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzEzNDgsImV4cCI6MjEwMjIwNzM0OH0.uMiXdjGAXmDAOdxbymDtHtAFjSQdYMJ-8qtvhijYO_w';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------------------- Meta / lookups ---------------------------- */
const TASK_STATUS = {
  todo:        { label:'Chưa bắt đầu',   color:'var(--muted)',   fill:'#898781' },
  in_progress: { label:'Đang thực hiện', color:'var(--blue)',    fill:'#2a78d6' },
  review:      { label:'Chờ xem xét',    color:'var(--orange)',  fill:'#eb6834' },
  blocked:     { label:'Bị chặn',        color:'var(--critical)',fill:'#d03b3b' },
  done:        { label:'Hoàn thành',     color:'var(--good)',    fill:'#0ca30c' },
};
const KANBAN_COLUMNS = ['todo','in_progress','review','blocked','done'];
const PRIORITY = {
  low:    { label:'Thấp',        color:'var(--muted)' },
  medium: { label:'Trung bình',  color:'var(--blue)' },
  high:   { label:'Cao',         color:'var(--serious)' },
  urgent: { label:'Khẩn cấp',    color:'var(--critical)' },
};
const APPROVAL = {
  not_required: { label:'Không yêu cầu', color:'var(--muted)' },
  pending:      { label:'Chờ phê duyệt', color:'var(--warning)' },
  approved:     { label:'Đã phê duyệt',  color:'var(--good)' },
  rejected:     { label:'Từ chối',       color:'var(--critical)' },
};
const PROJECT_STATUS = {
  planning:  { label:'Lên kế hoạch', color:'var(--muted)' },
  on_track:  { label:'Đúng tiến độ', color:'var(--good)' },
  at_risk:   { label:'Có rủi ro',    color:'var(--warning)' },
  off_track: { label:'Trễ tiến độ',  color:'var(--critical)' },
  on_hold:   { label:'Tạm dừng',     color:'var(--serious)' },
  completed: { label:'Hoàn thành',   color:'var(--blue)' },
};

/* ------------------------------- Utils ---------------------------------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ if(!s) return '—'; const d=parseDate(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtDateTime(iso){ if(!iso) return ''; const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function daysUntil(dateStr){ if(!dateStr) return null; return daysBetween(parseDate(todayStr()), parseDate(dateStr)); }
function isDueSoon(item){ if(!item.due_date || item.status==='done') return false; const d=daysUntil(item.due_date); return d!==null && d>=0 && d<=3; }
function isOverdue(item){ if(!item.due_date || item.status==='done') return false; const d=daysUntil(item.due_date); return d!==null && d<0; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
function initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return ((p[0]||'')[0]+((p[p.length-1]||'')[0]||'')).toUpperCase(); }
function avatarColor(id){ const colors=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#4a3aa7']; let h=0; for(const c of (id||'')) h=(h*31+c.charCodeAt(0))>>>0; return colors[h%colors.length]; }

/* --------------------------------- State --------------------------------- */
const State = {
  session:null, profile:null,
  view:'login', authTab:'login',
  projectId:null, projectTab:'list',
  adminTab:'users', adminSelectedProject:null,
  projects:[], profiles:[], allTasks:[], allComments:[], allMembers:[],
  expanded:{}, // taskId -> bool (tree expand state)
  openTaskId:null, openTaskDraft:null,
  showNewProject:false, showNewTask:null, // {projectId,parentId}
  confirmState:null, // {message, onConfirm}
  error:null, authBusy:false,
};

/* ------------------------------ Data layer ------------------------------- */
async function loadAll(){
  const [pr, pf, tk, cm, mb] = await Promise.all([
    sb.from('pt_projects').select('*').order('created_at'),
    sb.from('pt_profiles').select('*').order('full_name'),
    sb.from('pt_tasks').select('*').order('sort_order'),
    sb.from('pt_task_comments').select('*').order('created_at'),
    sb.from('pt_project_members').select('*'),
  ]);
  State.projects = pr.data || [];
  State.profiles = pf.data || [];
  State.allTasks = tk.data || [];
  State.allComments = cm.data || [];
  State.allMembers = mb.data || [];
}

function profileById(id){ return State.profiles.find(p=>p.id===id); }
function tasksOfProject(pid){ return State.allTasks.filter(t=>t.project_id===pid); }
function topTasks(pid){ return tasksOfProject(pid).filter(t=>!t.parent_task_id).sort((a,b)=>a.sort_order-b.sort_order); }
function childTasks(taskId){ return State.allTasks.filter(t=>t.parent_task_id===taskId).sort((a,b)=>a.sort_order-b.sort_order); }
function commentsOfTask(tid){ return State.allComments.filter(c=>c.task_id===tid); }
function membersOfProject(pid){ return State.allMembers.filter(m=>m.project_id===pid); }
function taskById(id){ return State.allTasks.find(t=>t.id===id); }
function projectById(id){ return State.projects.find(p=>p.id===id); }

function myRole(pid){
  if(!State.profile) return null;
  if(State.profile.is_admin) return 'admin';
  const m = State.allMembers.find(m=>m.project_id===pid && m.user_id===State.profile.id);
  return m ? m.role : null;
}
function canEdit(pid){ const r=myRole(pid); return r==='admin' || r==='editor'; }
function isGlobalAdmin(){ return !!(State.profile && State.profile.is_admin); }

function projectStats(pid){
  const tasks = tasksOfProject(pid);
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='done').length;
  const overdue = tasks.filter(isOverdue).length;
  const dueSoon = tasks.filter(isDueSoon).length;
  const blocked = tasks.filter(t=>t.status==='blocked').length;
  const feedback = tasks.reduce((s,t)=>s+commentsOfTask(t.id).length,0);
  const pct = total ? Math.round(done/total*100) : 0;
  return { total, done, overdue, dueSoon, blocked, feedback, pct };
}

/* ------------------------------- Mutations -------------------------------- */
async function mutate(promise, okMsg){
  const { error } = await promise;
  if(error){ toast(error.message || 'Có lỗi xảy ra', true); return false; }
  await loadAll();
  if(okMsg) toast(okMsg);
  render();
  return true;
}
async function createProject(payload){
  const { data, error } = await sb.from('pt_projects').insert({ ...payload, created_by: State.profile.id }).select().single();
  if(error){ toast(error.message, true); return null; }
  await sb.from('pt_project_members').insert({ project_id:data.id, user_id:State.profile.id, role:'admin' });
  await loadAll(); toast('Đã tạo dự án mới'); render();
  return data;
}
async function updateProject(id, patch){ return mutate(sb.from('pt_projects').update(patch).eq('id',id), 'Đã lưu dự án'); }
async function deleteProject(id){ return mutate(sb.from('pt_projects').delete().eq('id',id), 'Đã xoá dự án'); }
async function createTask(payload){
  const { error } = await sb.from('pt_tasks').insert({ ...payload, created_by:State.profile.id });
  if(error){ toast(error.message, true); return false; }
  await loadAll(); toast('Đã thêm công việc'); render();
  return true;
}
async function updateTask(id, patch){ return mutate(sb.from('pt_tasks').update(patch).eq('id',id), 'Đã lưu công việc'); }
async function deleteTask(id){ return mutate(sb.from('pt_tasks').delete().eq('id',id), 'Đã xoá công việc'); }
async function addComment(taskId, content){
  if(!content.trim()) return false;
  return mutate(sb.from('pt_task_comments').insert({ task_id:taskId, author_id:State.profile.id, content:content.trim() }));
}
async function deleteComment(id){ return mutate(sb.from('pt_task_comments').delete().eq('id',id)); }
async function addMember(projectId, userId, role){ return mutate(sb.from('pt_project_members').insert({ project_id:projectId, user_id:userId, role }), 'Đã thêm thành viên'); }
async function updateMemberRole(projectId, userId, role){ return mutate(sb.from('pt_project_members').update({role}).eq('project_id',projectId).eq('user_id',userId), 'Đã cập nhật quyền'); }
async function removeMember(projectId, userId){ return mutate(sb.from('pt_project_members').delete().eq('project_id',projectId).eq('user_id',userId), 'Đã xoá thành viên'); }
async function toggleAdmin(profileId, val){ return mutate(sb.from('pt_profiles').update({is_admin:val}).eq('id',profileId), 'Đã cập nhật quyền quản trị'); }

/* fix setApproval properly */
async function setApprovalStatus(taskId, status){
  const patch = { approval_status: status };
  if(status==='approved' || status==='rejected'){ patch.approved_by = State.profile.id; patch.approved_at = new Date().toISOString(); }
  else { patch.approved_by = null; patch.approved_at = null; }
  return mutate(sb.from('pt_tasks').update(patch).eq('id',taskId), status==='approved' ? 'Đã phê duyệt' : (status==='rejected' ? 'Đã từ chối' : 'Đã cập nhật'));
}

/* --------------------------------- Auth ----------------------------------- */
sb.auth.onAuthStateChange((_event, session) => {
  State.session = session;
  if(session){ afterLogin(); }
  else { State.profile=null; State.view='login'; render(); }
});

async function afterLogin(){
  const uid = State.session.user.id;
  let prof = null;
  for(let i=0;i<4;i++){
    const { data } = await sb.from('pt_profiles').select('*').eq('id',uid).maybeSingle();
    if(data){ prof = data; break; }
    await new Promise(r=>setTimeout(r, 500));
  }
  State.profile = prof;
  await loadAll();
  if(State.view==='login') State.view='projects';
  render();
}

async function handleLogin(email, password){
  State.error=null; State.authBusy=true; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  State.authBusy=false;
  if(error){ State.error = 'Đăng nhập thất bại: ' + error.message; }
  render();
}
async function handleSignup(email, password, fullName){
  State.error=null; State.authBusy=true; render();
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:fullName } } });
  State.authBusy=false;
  if(error){ State.error = 'Đăng ký thất bại: ' + error.message; }
  else { State.error = null; toastMessage='Đăng ký thành công. Nếu dự án yêu cầu xác thực email, hãy kiểm tra hộp thư trước khi đăng nhập.'; State.authTab='login'; }
  render();
}
async function handleLogout(){ await sb.auth.signOut(); State.view='login'; render(); }

/* --------------------------------- Toast ----------------------------------- */
function toast(msg, isErr){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

/* ------------------------------ Confirm modal ------------------------------ */
function askConfirm(message, onYes){
  State.confirmState = { message, onYes };
  renderModals();
}
function closeConfirm(){ State.confirmState=null; renderModals(); }

/* ================================ RENDER ================================== */
function render(){
  const app = document.getElementById('app');
  if(!State.session || !State.profile){
    app.innerHTML = viewLogin();
    bindLogin();
    renderModals();
    return;
  }
  app.innerHTML = viewShell();
  bindShell();
  renderModals();
}

function renderModals(){
  const root = document.getElementById('modal-root');
  let html = '';
  if(State.openTaskId) html += viewTaskModal();
  if(State.showNewProject) html += viewNewProjectModal();
  if(State.showNewTask) html += viewNewTaskModal();
  if(State.confirmState) html += viewConfirmModal();
  root.innerHTML = html;
  bindModals();
}

/* ------------------------------- Task list/tree ----------------------------- */
function taskDueBadge(t){
  if(!t.due_date) return '';
  let style = 'background:var(--page);color:var(--text-2);';
  if(isOverdue(t)) style = 'background:#d03b3b18;color:var(--critical);font-weight:700;';
  else if(isDueSoon(t)) style = 'background:#fab21922;color:var(--warning);font-weight:700;';
  return `<span class="task-due" style="${style}">${fmtDate(t.due_date)}</span>`;
}
function renderTaskRow(t, projectId, depth){
  const kids = childTasks(t.id);
  const hasKids = kids.length>0;
  const expanded = !!State.expanded[t.id];
  const assignee = profileById(t.assignee_id);
  const sMeta = TASK_STATUS[t.status];
  const glow = isDueSoon(t) ? 'due-soon' : (isOverdue(t) ? 'overdue-glow' : '');
  const editable = canEdit(projectId);
  return `
  <div class="task-row ${glow}" style="padding-left:${12+depth*22}px;">
    ${hasKids ? `<button class="expand-btn" data-expand="${t.id}">${expanded?'&#9660;':'&#9654;'}</button>` : `<span style="width:18px;display:inline-block;"></span>`}
    <div class="task-title-wrap" data-open-task="${t.id}">
      <div class="task-title">${escapeHtml(t.title)}</div>
      ${hasKids ? `<div class="task-sub-of">${kids.length} công việc con</div>` : ''}
    </div>
    <div class="task-side">
      <span class="badge" style="background:${sMeta.color}18;color:${sMeta.color}"><span class="dot" style="background:${sMeta.color}"></span>${sMeta.label}</span>
      ${t.approval_status!=='not_required' ? `<span class="badge" style="background:${APPROVAL[t.approval_status].color}18;color:${APPROVAL[t.approval_status].color}">${APPROVAL[t.approval_status].label}</span>` : ''}

/* ---------------------------------- Gantt ------------------------------------ */
function ganttRange(p){
  const tasks = tasksOfProject(p.id);
  let dates = [];
  tasks.forEach(t=>{ if(t.start_date) dates.push(t.start_date); if(t.due_date) dates.push(t.due_date); });
  if(p.start_date) dates.push(p.start_date);
  if(p.due_date) dates.push(p.due_date);
  if(!dates.length) dates=[todayStr()];
  let min = dates.reduce((a,b)=> a<b?a:b);
  let max = dates.reduce((a,b)=> a>b?a:b);
  const minD = parseDate(min); minD.setDate(minD.getDate()-4);
  const maxD = parseDate(max); maxD.setDate(maxD.getDate()+4);
  return { min:minD, max:maxD };
}
function pctOf(dateObj, range){
  const total = daysBetween(range.min, range.max) || 1;
  const off = daysBetween(range.min, dateObj);
  return Math.max(0, Math.min(100, off/total*100));
}
function monthHeaders(range){
  const months = [];
  let cur = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
  const totalDays = daysBetween(range.min, range.max) || 1;
  while(cur <= range.max){
    const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const segStart = cur < range.min ? range.min : cur;
    const segEnd = next > range.max ? range.max : next;
    const width = Math.max(0, daysBetween(segStart, segEnd)) / totalDays * 100;
    months.push({ label:`Th${cur.getMonth()+1}/${cur.getFullYear()}`, width });
    cur = next;
  }
  return months;
}
function ganttBarRow(t, p, range, depth){
  const kids = childTasks(t.id);
  const start = t.start_date ? parseDate(t.start_date) : (t.due_date ? (()=>{ const d=parseDate(t.due_date); d.setDate(d.getDate()-3); return d; })() : null);
  const end = t.due_date ? parseDate(t.due_date) : start;
  const meta = TASK_STATUS[t.status];
  let barHtml = '';
  if(start && end){
    const left = pctOf(start, range);
    const width = Math.max(1, pctOf(end, range) - left);
    barHtml = `<div class="gantt-bar" style="left:${left}%;width:${width}%;background:${meta.fill};" data-open-task="${t.id}" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>`;
  }
  let rows = `<div class="gantt-row">
    <div class="gantt-row-label ${depth>0?'sub':''}" style="padding-left:${10+depth*16}px;">${escapeHtml(t.title)}</div>
    <div class="gantt-track">${barHtml}</div>
  </div>`;
  kids.forEach(k=> rows += ganttBarRow(k, p, range, depth+1));
  return rows;
}
function viewGantt(p){
  const range = ganttRange(p);
  const top = topTasks(p.id);
  const todayPct = pctOf(parseDate(todayStr()), range);
  const months = monthHeaders(range);
  if(!top.length) return `<div class="card empty-hint">Chưa có công việc để hiển thị Gantt.</div>`;
  return `<div class="gantt-scroll"><div class="gantt-grid">
    <div class="gantt-header"><div style="width:230px;flex:0 0 230px;"></div>${months.map(m=>`<div class="gantt-month" style="width:${m.width}%;">${m.label}</div>`).join('')}</div>
    <div class="gantt-body">
      <div class="gantt-today" style="left:calc(230px + (100% - 230px) * ${todayPct}/100);"><div class="gantt-today-label">Hôm nay</div></div>
      ${top.map(t=>ganttBarRow(t,p,range,0)).join('')}
    </div>
  </div></div>`;
}

          <label class="field-label">Phê duyệt</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <span class="badge" style="background:${APPROVAL[t.approval_status].color}18;color:${APPROVAL[t.approval_status].color}">${APPROVAL[t.approval_status].label}</span>
            ${editable ? `
              <button class="btn btn-sm" data-approve="approved" style="color:var(--good);border-color:var(--good);">Duyệt</button>
              <button class="btn btn-sm" data-approve="rejected" style="color:var(--critical);border-color:var(--critical);">Từ chối</button>
              <button class="btn btn-sm" data-approve="pending">Chờ duyệt</button>
            ` : ''}
          </div>
        </div>
      </div>

      ${kids.length ? `<div class="modal-sec-title">Công việc con (${kids.length})</div>${kids.map(k=>`<div class="task-row" style="padding:8px 0;" data-open-task="${k.id}"><span style="flex:1;font-size:13px;cursor:pointer;">${escapeHtml(k.title)}</span><span class="badge" style="background:${TASK_STATUS[k.status].color}18;color:${TASK_STATUS[k.status].color}">${TASK_STATUS[k.status].label}</span></div>`).join('')}` : ''}

      <div class="modal-sec-title">Ý kiến phản hồi (${comments.length})</div>
      <div style="max-height:220px;overflow-y:auto;">
        ${comments.map(c=>{ const author=profileById(c.author_id); return `<div class="comment-item">
          <div class="comment-head"><div class="avatar" style="width:20px;height:20px;font-size:9px;background:${avatarColor(c.author_id)}">${initials(author?author.full_name:'?')}</div>${escapeHtml(author?author.full_name:'Ẩn danh')}<span class="comment-time">${fmtDateTime(c.created_at)}</span>
            ${(c.author_id===State.profile.id || isGlobalAdmin()) ? `<button class="icon-btn" style="margin-left:auto;" data-del-comment="${c.id}">&#128465;</button>` : ''}
          </div>
          <div class="comment-body">${nl2br(c.content)}</div>
        </div>`; }).join('') || '<div style="font-size:12.5px;color:var(--muted);padding:8px 0;">Chưa có phản hồi nào.</div>'}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <textarea id="tm-comment" rows="2" placeholder="Viết ý kiến phản hồi…" style="flex:1;"></textarea>
        <button class="btn btn-primary btn-sm" id="tm-send-comment" style="align-self:flex-end;">Gửi</button>
      </div>

      <div class="modal-actions">
        ${editable ? `<button class="btn btn-danger" id="tm-delete">Xoá công việc</button>` : ''}
        <div class="spacer"></div>
        <button class="btn" id="tm-cancel">Đóng</button>
        ${editable ? `<button class="btn btn-primary" id="tm-save">Lưu thay đổi</button>` : ''}
      </div>
    </div>
  </div>`;
}
function bindModals(){
  bindTaskModal();
  bindNewProjectModal();
  bindNewTaskModal();
  bindConfirmModal();
}
function bindTaskModal(){
  const overlay = document.getElementById('task-modal-overlay');
  if(!overlay) return;
  const t = taskById(State.openTaskId);
  const close = ()=>{ State.openTaskId=null; renderModals(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(); });
  document.getElementById('close-task-modal').addEventListener('click', close);
  document.getElementById('tm-cancel').addEventListener('click', close);
  document.querySelectorAll('[data-open-task]').forEach(el=>el.addEventListener('click',()=>{ State.openTaskId=el.dataset.openTask; renderModals(); }));

  const save = document.getElementById('tm-save');
  if(save) save.addEventListener('click', async ()=>{
    const patch = {
      title: document.getElementById('tm-title').value.trim() || t.title,
      description: document.getElementById('tm-desc').value,
      assignee_id: document.getElementById('tm-assignee').value || null,
      status: document.getElementById('tm-status').value,
      start_date: document.getElementById('tm-start').value || null,
      due_date: document.getElementById('tm-due').value || null,
      priority: document.getElementById('tm-priority').value,
    };
    const ok = await updateTask(t.id, patch);
    if(ok){ State.openTaskId=null; }
    renderModals();
  });
  const del = document.getElementById('tm-delete');
  if(del) del.addEventListener('click', ()=>{
    askConfirm(`Xoá công việc "${t.title}"? Mọi công việc con và phản hồi liên quan cũng sẽ bị xoá.`, async ()=>{ await deleteTask(t.id); State.openTaskId=null; render(); });
  });
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', ()=> setApprovalStatus(t.id, b.dataset.approve).then(renderModals)));
  const sendBtn = document.getElementById('tm-send-comment');
  if(sendBtn) sendBtn.addEventListener('click', async ()=>{
    const ta = document.getElementById('tm-comment');
    if(!ta.value.trim()) return;
    await addComment(t.id, ta.value);
    renderModals();
  });
  document.querySelectorAll('[data-del-comment]').forEach(b=>b.addEventListener('click', ()=> askConfirm('Xoá phản hồi này?', ()=>deleteComment(b.dataset.delComment).then(renderModals))));
}

/* ------------------------------- New project modal -------------------------------- */
function viewNewProjectModal(){
  return `<div class="overlay" id="np-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>Tạo dự án mới</h2><button class="modal-close" id="np-close">&times;</button></div>
      <div class="field"><label class="field-label">Tên dự án</label><input type="text" id="np-name" placeholder="VD: Ra mắt sản phẩm X"></div>
      <div class="field"><label class="field-label">Mô tả</label><textarea id="np-desc" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label class="field-label">Ngày bắt đầu</label><input type="date" id="np-start"></div>
        <div class="field"><label class="field-label">Hạn hoàn thành</label><input type="date" id="np-due"></div>
      </div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="np-cancel">Huỷ</button>
        <button class="btn btn-primary" id="np-create">Tạo dự án</button>
      </div>
    </div>
  </div>`;
}
function bindNewProjectModal(){
  const overlay = document.getElementById('np-overlay');
  if(!overlay) return;
  const close = ()=>{ State.showNewProject=false; renderModals(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(); });
  document.getElementById('np-close').addEventListener('click', close);
  document.getElementById('np-cancel').addEventListener('click', close);
  document.getElementById('np-create').addEventListener('click', async ()=>{
    const name = document.getElementById('np-name').value.trim();
    if(!name){ toast('Vui lòng nhập tên dự án', true); return; }
    const payload = {
      name, description: document.getElementById('np-desc').value,
      start_date: document.getElementById('np-start').value || null,
      due_date: document.getElementById('np-due').value || null,
      status: 'planning',
    };
    State.showNewProject=false;
    await createProject(payload);
  });
}

/* --------------------------------- New task modal ---------------------------------- */
function viewNewTaskModal(){
  const { projectId, parentId } = State.showNewTask;
  const p = projectById(projectId);
  const members = membersOfProject(projectId);
  const parent = parentId ? taskById(parentId) : null;
  return `<div class="overlay" id="nt-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>${parent ? 'Thêm công việc con' : 'Thêm công việc lớn'}</h2><button class="modal-close" id="nt-close">&times;</button></div>
      ${parent ? `<div class="crumb" style="margin-bottom:10px;">Thuộc: ${escapeHtml(parent.title)}</div>` : ''}
      <div class="field"><label class="field-label">Tên công việc</label><input type="text" id="nt-title" placeholder="Nhập nội dung công việc"></div>
      <div class="field"><label class="field-label">Mô tả chi tiết</label><textarea id="nt-desc" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label class="field-label">Người phụ trách</label><select id="nt-assignee"><option value="">— Chưa gán —</option>${members.map(m=>{ const pr=profileById(m.user_id); return `<option value="${m.user_id}">${escapeHtml(pr?pr.full_name:'')}</option>`; }).join('')}</select></div>
        <div class="field"><label class="field-label">Mức ưu tiên</label><select id="nt-priority">${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${k==='medium'?'selected':''}>${v.label}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Ngày bắt đầu</label><input type="date" id="nt-start"></div>
        <div class="field"><label class="field-label">Hạn hoàn thành</label><input type="date" id="nt-due"></div>
      </div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="nt-cancel">Huỷ</button>
        <button class="btn btn-primary" id="nt-create">Thêm công việc</button>
      </div>
    </div>
  </div>`;
}
function bindNewTaskModal(){
  const overlay = document.getElementById('nt-overlay');
  if(!overlay) return;
  const { projectId, parentId } = State.showNewTask;
  const close = ()=>{ State.showNewTask=null; renderModals(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(); });
  document.getElementById('nt-close').addEventListener('click', close);
  document.getElementById('nt-cancel').addEventListener('click', close);
  document.getElementById('nt-create').addEventListener('click', async ()=>{
    const title = document.getElementById('nt-title').value.trim();
    if(!title){ toast('Vui lòng nhập tên công việc', true); return; }
    const payload = {
      project_id: projectId, parent_task_id: parentId,
      title, description: document.getElementById('nt-desc').value,
      assignee_id: document.getElementById('nt-assignee').value || null,
      priority: document.getElementById('nt-priority').value,
      start_date: document.getElementById('nt-start').value || null,
      due_date: document.getElementById('nt-due').value || null,
    };
    State.showNewTask=null;
    if(parentId) State.expanded[parentId]=true;
    await createTask(payload);
  });
}

/* ----------------------------------- Confirm modal ------------------------------------ */
function viewConfirmModal(){
  return `<div class="overlay" id="cf-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>Xác nhận</h2></div>
      <p style="font-size:13.5px;color:var(--text-2);line-height:1.6;">${escapeHtml(State.confirmState.message)}</p>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="cf-no">Huỷ</button>
        <button class="btn btn-danger" id="cf-yes">Xác nhận</button>
      </div>
    </div>
  </div>`;
}
function bindConfirmModal(){
  const overlay = document.getElementById('cf-overlay');
  if(!overlay) return;
  const { onYes } = State.confirmState;
  document.getElementById('cf-no').addEventListener('click', closeConfirm);
  document.getElementById('cf-yes').addEventListener('click', async ()=>{ closeConfirm(); await onYes(); });
}

/* -------------------------------------- Boot --------------------------------------- */
(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  State.session = session;
  if(session){ await afterLogin(); } else { render(); }
})();
</script>
</body>
</html>
