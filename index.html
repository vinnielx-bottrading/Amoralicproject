<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Tracker — Dashboard theo dõi dự án</title>
<style>
  :root{
    color-scheme: light;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --blue: #2a78d6;
    --orange: #eb6834;
    --aqua: #1baf7a;
    --yellow: #eda100;
    --magenta: #e87ba4;
    --green: #008300;
    --violet: #4a3aa7;
    --red: #e34948;
    --good: #0ca30c;
    --warning: #c98500;
    --warning-bg: #fab21922;
    --serious: #ec835a;
    --critical: #d03b3b;
    --sidebar-w: 244px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; font-size:14px; }
  button{ cursor:pointer; }
  a{ color:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--baseline); border-radius:6px; }

  /* ---------- Layout ---------- */
  #app{ min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width: var(--sidebar-w); flex:0 0 auto; background:var(--surface);
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid var(--border); }
  .brand-mark{ width:30px;height:30px;border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--violet)); flex:0 0 auto; }
  .brand-text{ font-weight:700; font-size:15px; line-height:1.2; }
  .brand-sub{ font-size:11px; color:var(--muted); }
  .nav{ padding:10px; display:flex; flex-direction:column; gap:2px; flex:1 1 auto; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    color:var(--text-2); text-decoration:none; border:none; background:transparent; text-align:left; width:100%;
    font-size:14px; font-weight:500;
  }
  .nav-item:hover{ background:var(--page); color:var(--text); }
  .nav-item.active{ background:#2a78d614; color:var(--blue); }
  .nav-icon{ width:18px; text-align:center; flex:0 0 auto; }
  .nav-sep{ margin:10px 4px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:0 8px; }
  .sidebar-foot{ border-top:1px solid var(--border); padding:12px; display:flex; align-items:center; gap:10px; }
  .avatar{
    width:32px;height:32px;border-radius:50%; background:var(--blue); color:#fff; display:flex;
    align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto;
  }
  .foot-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot-role{ font-size:11px; color:var(--muted); }
  .logout-btn{ margin-left:auto; border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:6px 9px; font-size:12px; color:var(--text-2); }
  .logout-btn:hover{ background:var(--page); }

  .main{ flex:1 1 auto; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 26px;
    border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:18px; margin:0; font-weight:700; }
  .topbar .crumb{ font-size:12px; color:var(--muted); margin-top:2px; }
  .content{ padding:26px; max-width:1320px; }

  /* ---------- Buttons / inputs ---------- */
  .btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; }
  .btn:hover{ background:var(--page); }
  .btn-primary{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn-primary:hover{ background:#2166b8; }
  .btn-danger{ background:#fff; border-color:var(--critical); color:var(--critical); }
  .btn-danger:hover{ background:#d03b3b12; }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--page); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);
  }
  input:focus,textarea:focus,select:focus{ outline:2px solid #2a78d655; border-color:var(--blue); }
  label.field-label{ font-size:12px; font-weight:600; color:var(--text-2); display:block; margin:0 0 5px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ---------- Cards / badges ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:12px; font-weight:600; white-space:nowrap; }
  .dot{ width:7px;height:7px;border-radius:50%; flex:0 0 auto; }
  .progress-track{ height:7px; background:var(--grid); border-radius:100px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--blue); border-radius:100px; }

  /* due-soon glow */
  @keyframes glow-pulse{
    0%,100%{ box-shadow:0 0 0 0 #fab21966, 0 0 0 1px #fab219aa inset; }
    50%{ box-shadow:0 0 0 5px #fab21900, 0 0 0 1px #fab219aa inset; }
  }
  /* overdue: strong red glow + red border/tint so it reads unmistakably at a glance (Tổng Giám Đốc scan) */
  @keyframes glow-pulse-critical{
    0%,100%{ box-shadow:0 0 6px 2px #d03b3b99, 0 0 0 2px var(--critical) inset; }
    50%{ box-shadow:0 0 22px 7px #d03b3bd9, 0 0 0 2px var(--critical) inset; }
  }
  .due-soon{ animation: glow-pulse 1.8s ease-in-out infinite; }
  .overdue-glow{
    animation: glow-pulse-critical 1.4s ease-in-out infinite;
    border-color: var(--critical) !important;
    background: #d03b3b0d;
  }
  .overdue-glow .task-title,
  .overdue-glow .kanban-card-title,
  .overdue-glow.project-card h3{ color:var(--critical); }
  .overdue-tag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; color:#fff; background:var(--critical); padding:2px 7px; border-radius:100px; letter-spacing:.02em; text-transform:uppercase; }
  .gantt-bar.overdue-glow{ animation: glow-pulse-critical 1.4s ease-in-out infinite; outline:2px solid var(--critical); background:var(--critical) !important; }

  /* ---------- Login ---------- */
  .login-wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:16px; }
  .login-card{ width:100%; max-width:400px; padding:30px; }
  .disclosure-box{ width:100%; max-width:400px; padding:14px 16px; font-size:11.5px; line-height:1.6; color:var(--muted); text-align:center; }
  .disclosure-box b{ color:var(--text-2); }
  .login-title{ font-size:20px; font-weight:800; margin:2px 0 3px; }
  .login-sub{ font-size:13px; color:var(--muted); margin-bottom:22px; }
  .login-tabs{ display:flex; gap:4px; background:var(--page); padding:3px; border-radius:9px; margin-bottom:20px; }
  .login-tab{ flex:1; padding:7px; border-radius:7px; border:none; background:transparent; font-weight:600; font-size:13px; color:var(--text-2); }
  .login-tab.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 2px var(--border); }
  .demo-box{ margin-top:20px; padding:12px 14px; border-radius:9px; background:var(--page); border:1px solid var(--border); font-size:12px; color:var(--text-2); line-height:1.7; }
  .demo-box b{ color:var(--text); }
  .err-box{ background:#d03b3b12; border:1px solid #d03b3b44; color:var(--critical); padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; }

  /* ---------- Stat tiles ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi-tile{ padding:16px; }
  .kpi-label{ font-size:12px; color:var(--muted); font-weight:600; }
  .kpi-value{ font-size:26px; font-weight:800; margin-top:4px; font-variant-numeric: proportional-nums; }
  .kpi-value.warn{ color:var(--warning); }
  .kpi-value.crit{ color:var(--critical); }
  .kpi-value.good{ color:var(--good); }

  /* ---------- Project cards ---------- */
  .project-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .project-card{ padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; }
  .project-card:hover{ border-color:var(--baseline); }
  .project-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .project-card h3{ margin:0; font-size:15px; }
  .project-desc{ font-size:12.5px; color:var(--text-2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .project-meta-row{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--muted); }
  .member-stack{ display:flex; }
  .member-stack .avatar{ width:24px;height:24px; font-size:10px; margin-left:-8px; border:2px solid var(--surface); }
  .member-stack .avatar:first-child{ margin-left:0; }

  /* ---------- Tabs ---------- */
  .tabbar{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .tabbtn{ padding:9px 14px; border:none; background:transparent; font-weight:600; font-size:13.5px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabbtn.active{ color:var(--blue); border-bottom-color:var(--blue); }

  /* ---------- Task list / tree ---------- */
  .task-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--grid); }
  .task-row:hover{ background:var(--page); }
  .task-row .expand-btn{ width:18px; height:18px; flex:0 0 auto; border:none; background:transparent; color:var(--muted); }
  .task-title-wrap{ flex:1 1 auto; min-width:0; cursor:pointer; }
  .task-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task-sub-of{ font-size:11px; color:var(--muted); }
  .task-side{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .task-due{ font-size:12px; color:var(--text-2); padding:3px 8px; border-radius:100px; }
  .task-assignee{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-2); }
  .icon-btn{ border:none; background:transparent; color:var(--muted); padding:5px; border-radius:6px; }
  .icon-btn:hover{ background:var(--grid); color:var(--text); }
  .icon-btn:disabled{ opacity:.3; cursor:default; }
  .icon-btn:disabled:hover{ background:transparent; color:var(--muted); }
  .add-subtask-row{ padding:8px 12px 8px 44px; }
  .empty-hint{ padding:30px; text-align:center; color:var(--muted); font-size:13px; }
  .task-order-label{ font-weight:800; color:var(--blue); margin-right:4px; }
  .task-move-col{ display:flex; flex-direction:column; gap:0; flex:0 0 auto; }
  .task-move-col .icon-btn{ padding:1px; line-height:1; font-size:11px; }
  .list-toolbar{ display:flex; justify-content:flex-end; padding:10px 12px; border-bottom:1px solid var(--grid); }

  /* ---------- Kanban ---------- */
  .kanban-wrap{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; }
  .kanban-col{ flex:0 0 260px; background:var(--page); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:200px; }
  .kanban-col.drag-over{ outline:2px dashed var(--blue); outline-offset:-2px; }
  .kanban-col-head{ display:flex; align-items:center; gap:8px; padding:4px 4px 10px; font-size:12.5px; font-weight:700; }
  .kanban-count{ margin-left:auto; font-size:11px; color:var(--muted); font-weight:600; background:var(--surface); border-radius:100px; padding:1px 7px; }
  .kanban-card{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px; margin-bottom:8px; cursor:grab; }
  .kanban-card:active{ cursor:grabbing; }
  .kanban-card-title{ font-size:12.5px; font-weight:700; margin-bottom:6px; line-height:1.35; }
  .kanban-card-foot{ display:flex; align-items:center; justify-content:space-between; gap:6px; }

  /* ---------- Gantt ---------- */
  .gantt-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  .gantt-grid{ position:relative; min-width:900px; }
  .gantt-header{ display:flex; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
  .gantt-month{ border-right:1px solid var(--grid); font-size:11px; color:var(--muted); padding:8px 6px; font-weight:600; }
  .gantt-body{ position:relative; }
  .gantt-row{ display:flex; align-items:center; height:36px; border-bottom:1px solid var(--grid); position:relative; }
  .gantt-row-label{ position:sticky; left:0; background:var(--surface); width:230px; flex:0 0 230px; padding:0 10px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--border); height:100%; display:flex; align-items:center; z-index:1; }
  .gantt-row-label.sub{ font-weight:500; color:var(--text-2); padding-left:22px; }
  .gantt-track{ position:relative; flex:1 1 auto; height:100%; }
  .gantt-bar{ position:absolute; top:7px; height:22px; border-radius:6px; min-width:8px; display:flex; align-items:center; padding:0 8px; font-size:10.5px; color:#fff; font-weight:700; white-space:nowrap; overflow:hidden; cursor:pointer; }
  .gantt-today{ position:absolute; top:0; bottom:0; width:2px; background:var(--critical); z-index:3; }
  .gantt-today-label{ position:absolute; top:-18px; font-size:10px; color:var(--critical); font-weight:700; transform:translateX(-50%); }

  /* ---------- Bar rows (stats) ---------- */
  .barrow{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .barrow-label{ width:150px; flex:0 0 auto; font-size:12.5px; color:var(--text-2); display:flex; align-items:center; gap:6px; font-weight:600; }
  .barrow-track{ flex:1 1 auto; height:9px; background:var(--grid); border-radius:100px; overflow:hidden; }
  .barrow-fill{ height:100%; border-radius:100px; }
  .barrow-value{ width:34px; flex:0 0 auto; text-align:right; font-size:12.5px; font-weight:700; font-variant-numeric: tabular-nums; }

  /* ---------- Stats: trend chart / tables / grouped lists ---------- */
  .stats-3col{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .stats-list-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid var(--grid); cursor:pointer; }
  .stats-list-row:last-child{ border-bottom:none; }
  .stats-list-row .name{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stats-list-row .meta{ font-size:11px; color:var(--muted); white-space:nowrap; flex:0 0 auto; }
  .data-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .data-table th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .data-table td{ padding:9px 10px; border-bottom:1px solid var(--grid); vertical-align:middle; }
  .data-table tbody tr:hover td{ background:var(--page); }
  .data-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .data-table tr.row-overdue td{ color:var(--critical); }
  .data-table tr.row-overdue{ background:#d03b3b0a; }
  .chart-legend{ display:flex; gap:16px; margin-bottom:8px; font-size:11.5px; color:var(--text-2); flex-wrap:wrap; }
  .chart-legend .key{ display:inline-flex; align-items:center; gap:5px; }
  .chart-legend .line{ width:14px; height:2px; display:inline-block; border-radius:2px; }
  @media (max-width:980px){ .stats-3col{ grid-template-columns:1fr; } }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(11,11,11,0.42); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
  .modal{ width:100%; max-width:640px; padding:22px 24px 24px; margin-bottom:40px; }
  .modal-sm{ max-width:420px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head h2{ margin:0; font-size:16px; }
  .modal-close{ border:none; background:transparent; color:var(--muted); font-size:18px; padding:4px 8px; border-radius:6px; }
  .modal-close:hover{ background:var(--page); }
  @keyframes modal-shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
  .modal-shake{ animation: modal-shake 0.35s ease-in-out; }
  .draft-hint{ font-size:11.5px; color:var(--warning); background:var(--warning-bg); border-radius:8px; padding:6px 10px; margin:-6px 0 12px; }
  .modal-sec-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:18px 0 8px; }
  .comment-item{ padding:9px 0; border-bottom:1px solid var(--grid); }
  .comment-head{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; margin-bottom:3px; }
  .comment-time{ font-weight:500; color:var(--muted); }
  .comment-body{ font-size:13px; color:var(--text-2); line-height:1.5; white-space:pre-wrap; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .modal-actions .spacer{ flex:1 1 auto; }

  .toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--text); color:#fff; padding:10px 16px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.2); }
  .toast.err{ background:var(--critical); }

  .members-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grid); }
  .members-row .name{ font-size:13px; font-weight:600; }
  .members-row .email{ font-size:11.5px; color:var(--muted); }
  .role-select{ width:auto; padding:5px 8px; font-size:12px; }

  .issue-item{ padding:10px 0; border-bottom:1px solid var(--grid); }
  .issue-item:last-child{ border-bottom:none; }
  .issue-title{ font-size:13px; font-weight:700; }
  .issue-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .section-title{ font-size:15px; font-weight:700; margin:0 0 12px; }
  .two-col{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 980px){ .two-col{ grid-template-columns:1fr; } }
  .pad{ padding:18px; }
  .toggle{ position:relative; width:38px; height:22px; border-radius:100px; background:var(--grid); border:none; flex:0 0 auto; }
  .toggle.on{ background:var(--blue); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on .knob{ left:18px; }

  @media (max-width: 860px){
    .sidebar{ display:none; }
    .content{ padding:16px; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

const TASK_STATUS = {

/* ------------------------------- Utils ---------------------------------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ if(!s) return '—'; const d=parseDate(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtDateTime(iso){ if(!iso) return ''; const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function daysUntil(dateStr){ if(!dateStr) return null; return daysBetween(parseDate(todayStr()), parseDate(dateStr)); }
function isDoneItem(item){ return item.status==='done' || item.status==='completed'; }
function isDueSoon(item){ if(!item.due_date || isDoneItem(item)) return false; const d=daysUntil(item.due_date); return d!==null && d>=0 && d<=3; }
function isOverdue(item){ if(!item.due_date || isDoneItem(item)) return false; const d=daysUntil(item.due_date); return d!==null && d<0; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
function initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return ((p[0]||'')[0]+((p[p.length-1]||'')[0]||'')).toUpperCase(); }
function avatarColor(id){ const colors=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#4a3aa7']; let h=0; for(const c of (id||'')) h=(h*31+c.charCodeAt(0))>>>0; return colors[h%colors.length]; }

async function loadAll(){
  const [pr, pf, tk, cm, mb] = await Promise.all([
    sb.from('pt_projects').select('*').order('created_at'),
    sb.from('pt_profiles').select('*').order('full_name'),
    sb.from('pt_tasks').select('*').order('sort_order'),
    sb.from('pt_task_comments').select('*').order('created_at'),
    sb.from('pt_project_members').select('*'),
  ]);
  State.projects = pr.data || [];
  State.profiles = pf.data || [];
  State.allTasks = tk.data || [];
  State.allComments = cm.data || [];
  State.allMembers = mb.data || [];
}

function profileById(id){ return State.profiles.find(p=>p.id===id); }
function tasksOfProject(pid){ return State.allTasks.filter(t=>t.project_id===pid); }
function topTasks(pid){ return tasksOfProject(pid).filter(t=>!t.parent_task_id).sort((a,b)=>a.sort_order-b.sort_order); }
function childTasks(taskId){ return State.allTasks.filter(t=>t.parent_task_id===taskId).sort((a,b)=>a.sort_order-b.sort_order); }
function commentsOfTask(tid){ return State.allComments.filter(c=>c.task_id===tid); }
function membersOfProject(pid){ return State.allMembers.filter(m=>m.project_id===pid); }
function taskById(id){ return State.allTasks.find(t=>t.id===id); }
function projectById(id){ return State.projects.find(p=>p.id===id); }

function myRole(pid){
  if(!State.profile) return null;
  if(State.profile.is_admin) return 'admin';
  const m = State.allMembers.find(m=>m.project_id===pid && m.user_id===State.profile.id);
  if(!m || m.removed_at) return null; // removed members have no access
  if(m.role==='admin' && !m.admin_approved) return 'editor'; // pending project-admin grant falls back to editor
  return m.role;
}
function canEdit(pid){ const r=myRole(pid); return r==='admin' || r==='editor'; }
function canEditDates(pid){ return isGlobalAdmin() || myRole(pid)==='admin'; }
function canApprove(pid){ return isGlobalAdmin() || myRole(pid)==='approver'; }
function isGlobalAdmin(){ return !!(State.profile && State.profile.is_admin); }
function isAdminProfile(id){ const pr=profileById(id); return !!(pr && pr.is_admin); }
function isPendingProjectAdmin(pid){
  const m = State.allMembers.find(m=>m.project_id===pid && m.user_id===State.profile.id);
  return !!(m && m.role==='admin' && !m.admin_approved && !m.removed_at);
}
// Active (not removed), non-Administrator members — used for rosters & assignment pickers.
function visibleMembers(pid){ return membersOfProject(pid).filter(m=>!m.removed_at && !isAdminProfile(m.user_id)); }
function removedMembers(pid){ return membersOfProject(pid).filter(m=>m.removed_at && !isAdminProfile(m.user_id)); }

function projectStats(pid){
  const tasks = tasksOfProject(pid);
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='done').length;
  const overdue = tasks.filter(isOverdue).length;
  const dueSoon = tasks.filter(isDueSoon).length;
  const blocked = tasks.filter(t=>t.status==='blocked').length;
  const feedback = tasks.reduce((s,t)=>s+commentsOfTask(t.id).length,0);
  const pct = total ? Math.round(done/total*100) : 0;
  return { total, done, overdue, dueSoon, blocked, feedback, pct };
}

/* ---------------------- Sắp xếp thứ tự công việc theo ngày ---------------------- */
// Công việc không có ngày bắt đầu được xếp sau cùng trong nhóm anh em của nó.
function taskDateSortKey(t){ return t.start_date || '9999-12-31'; }
// Chèn một công việc (vừa tạo, hoặc vừa đổi ngày bắt đầu) vào đúng vị trí theo ngày trong
// nhóm anh em (cùng project_id + cùng parent_task_id), không xáo trộn thứ tự tương đối của
// các công việc còn lại (giữ nguyên các lần move up/down thủ công trước đó).
async function repositionTaskByDate(task){
  if(!task) return;
  const siblings = (task.parent_task_id ? childTasks(task.parent_task_id) : topTasks(task.project_id)).filter(s=>s.id!==task.id);
  const key = taskDateSortKey(task);
  let insertAt = siblings.findIndex(s=>taskDateSortKey(s) > key);
  if(insertAt===-1) insertAt = siblings.length;
  const ordered = siblings.slice();
  ordered.splice(insertAt, 0, task);
  const updates = [];
  ordered.forEach((t,i)=>{ if(t.sort_order!==i) updates.push(sb.from('pt_tasks').update({sort_order:i}).eq('id',t.id)); });
  if(updates.length) await Promise.all(updates);
}
// Sắp xếp lại TOÀN BỘ công việc trong dự án theo ngày bắt đầu (theo từng nhóm anh em), dùng để
// dọn lại dữ liệu cũ đã bị xếp lộn xộn — chỉ Administrator / Quản trị dự án mới gọi được (xem canEditDates).
async function resortProjectByDate(projectId){
  const tasks = tasksOfProject(projectId);
  const groups = {};
  tasks.forEach(t=>{ const key = t.parent_task_id || '__top__'; (groups[key] = groups[key] || []).push(t); });
  const updates = [];
  Object.values(groups).forEach(group=>{
    const sorted = group.slice().sort((a,b)=>{
      const ka=taskDateSortKey(a), kb=taskDateSortKey(b);
      if(ka!==kb) return ka<kb ? -1 : 1;
      return a.sort_order - b.sort_order; // giữ ổn định khi trùng ngày
    });
    sorted.forEach((t,i)=>{ if(t.sort_order!==i) updates.push(sb.from('pt_tasks').update({sort_order:i}).eq('id',t.id)); });
  });
  if(!updates.length){ toast('Thứ tự hiện tại đã đúng theo ngày bắt đầu'); return; }
  const results = await Promise.all(updates);
  const err = results.find(r=>r && r.error);
  if(err){ toast(err.error.message || 'Có lỗi xảy ra', true); return; }
  await loadAll(); toast('Đã sắp xếp lại theo ngày bắt đầu'); render();
}
// Move up/down thủ công: chuẩn hoá sort_order của cả nhóm anh em theo thứ tự hiển thị hiện tại
// (khắc phục luôn dữ liệu cũ có sort_order trùng nhau/đều bằng 0) rồi hoán đổi vị trí 2 công việc.
async function moveTaskUpDown(taskId, direction){
  const t = taskById(taskId);
  if(!t) return;
  const siblings = t.parent_task_id ? childTasks(t.parent_task_id) : topTasks(t.project_id);
  const idx = siblings.findIndex(s=>s.id===taskId);
  const swapIdx = direction==='up' ? idx-1 : idx+1;
  if(idx<0 || swapIdx<0 || swapIdx>=siblings.length) return;
  const ids = siblings.map(s=>s.id);
  [ids[idx], ids[swapIdx]] = [ids[swapIdx], ids[idx]];
  const updates = ids.map((id,i)=> sb.from('pt_tasks').update({sort_order:i}).eq('id',id));
  const results = await Promise.all(updates);
  const err = results.find(r=>r && r.error);
  if(err){ toast(err.error.message || 'Có lỗi xảy ra', true); return; }
  await loadAll(); render();
}

/* ---------------------- Đánh số thứ tự công việc (I, II.. / 1, 2../ a, b..) ---------------------- */
function toRomanUpper(num){
  const table = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let n = num, out = '';
  for(const [v,s] of table){ while(n>=v){ out+=s; n-=v; } }
  return out || String(num);
}
function toLetterLower(num){
  let n = num, out = '';
  while(n>0){ const rem=(n-1)%26; out = String.fromCharCode(97+rem) + out; n = Math.floor((n-1)/26); }
  return out || String(num);
}
// depth 0 -> I, II, III...   depth 1 -> 1, 2, 3...   depth 2 -> a, b, c...
// depth 3+ lặp lại chu kỳ trên (I/1/a) để vẫn có nhãn hợp lý dù cây lồng sâu hơn dự kiến.
function taskOrderLabel(depth, idx1){
  const scheme = depth % 3;
  if(scheme===0) return toRomanUpper(idx1) + '.';
  if(scheme===1) return String(idx1) + '.';
  return toLetterLower(idx1) + '.';
}
// Tính độ sâu (depth) và vị trí (idx1, 1-based) của một công việc trong nhóm anh em đã sắp xếp —
// dùng để hiển thị nhãn số thứ tự (I./1./a.) ở những nơi ngoài renderTaskRow, như tiêu đề modal.
function taskPositionInfo(t){
  let depth = 0, cur = t;
  while(cur && cur.parent_task_id){ depth++; cur = taskById(cur.parent_task_id); }
  const siblings = t.parent_task_id ? childTasks(t.parent_task_id) : topTasks(t.project_id);
  const idx1 = Math.max(1, siblings.findIndex(s=>s.id===t.id) + 1);
  return { depth, idx1 };
}

// Changing another user's password or fully deleting their account both require Supabase's
// service-role key, which must NEVER be embedded in client code — so both go through the
// 'admin-manage-user' Edge Function, which verifies the caller is an Administrator itself
// before touching anything. See that function's source for the actual privileged logic.
async function callAdminManageUser(action, targetId, extra){
  const { data:{ session } } = await sb.auth.getSession();
  const token = session ? session.access_token : null;
  let res, body;
  try{
    res = await fetch(`${SUPABASE_URL}/functions/v1/admin-manage-user`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${token}`, 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify({ action, targetId, ...extra }),
    });
    body = await res.json().catch(()=>({}));
  }catch(e){
    toast('Không thể kết nối máy chủ để thực hiện thao tác này.', true);
    return false;
  }
  if(!res.ok || body.error){ toast(body.error || 'Có lỗi xảy ra', true); return false; }
  return true;
}

  const ok = await callAdminManageUser('setPassword', targetId, { newPassword });
  if(ok){ toast('Đã đổi mật khẩu'); State.showChangePassword=null; renderModals(); }
  return ok;
}

/* --------------------------------- Auth ----------------------------------- */
sb.auth.onAuthStateChange((_event, session) => {
  State.session = session;
  if(session){ afterLogin(); }
  else { State.profile=null; State.view='login'; render(); }
});

async function afterLogin(){
  const uid = State.session.user.id;
  let prof = null;
  for(let i=0;i<4;i++){
    const { data } = await sb.from('pt_profiles').select('*').eq('id',uid).maybeSingle();
    if(data){ prof = data; break; }
    await new Promise(r=>setTimeout(r, 500));
  }
  if(!prof){
    // No profile row (account was rejected/deleted by an Administrator, or never finished
    // provisioning) — don't leave the user stuck on a blank/half-logged-in screen.
    await sb.auth.signOut();
    State.session = null; State.profile = null; State.view = 'login';
    State.error = 'Tài khoản của bạn không còn tồn tại trong hệ thống (có thể đã bị từ chối hoặc xoá bởi Administrator). Vui lòng liên hệ Administrator hoặc đăng ký lại.';
    render();
    return;
  }
  State.profile = prof;
  await loadAll();
  if(State.view==='login') State.view='projects';
  render();
}

async function handleLogin(email, password){
  State.error=null; State.authBusy=true; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  State.authBusy=false;
  if(error){ State.error = 'Đăng nhập thất bại: ' + error.message; }
  render();
}

  State.error=null; State.authBusy=true; render();
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:fullName } } });
  State.authBusy=false;
  if(error){ State.error = 'Đăng ký thất bại: ' + error.message; }
  else { State.error = null; toastMessage='Đăng ký thành công. Nếu dự án yêu cầu xác thực email, hãy kiểm tra hộp thư trước khi đăng nhập.'; State.authTab='login'; }
  render();
}

/* --------------------------------- Toast ----------------------------------- */
function toast(msg, isErr){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

// Trình duyệt (đặc biệt trên di động, hoặc khi mở nhiều tab) có thể "giải phóng" tab đang chạy
// ngầm để tiết kiệm bộ nhớ — người dùng gõ dở một biểu mẫu, mở tab khác xem thông tin, quay lại
// thì trang đã bị tải lại từ đầu và mất hết nội dung đang nhập. Để tránh mất dữ liệu, các form
// nhập liệu (thêm/sửa công việc, thêm dự án, bình luận) tự động lưu nháp vào localStorage mỗi khi
// gõ, và tự khôi phục lại nếu form được mở lại trước khi lưu/huỷ.
function draftKey(kind, id){ return 'pt_draft_' + kind + '_' + (id || 'x'); }
function saveDraftData(key, data){ try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){} }
function loadDraftData(key){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function clearDraft(key){ try{ localStorage.removeItem(key); }catch(e){} }
let _draftSaveTimer = null;
// Gắn tự động lưu nháp (debounce ~350ms) cho danh sách field id của 1 form vào key chỉ định.
function wireDraftAutosave(key, fieldIds){
  const save = ()=>{
    clearTimeout(_draftSaveTimer);
    _draftSaveTimer = setTimeout(()=>{
      const data = {};
      fieldIds.forEach(fid=>{ const f=document.getElementById(fid); if(f) data[fid]=f.value; });
      saveDraftData(key, data);
    }, 350);
  };
  fieldIds.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', save);
    el.addEventListener('change', save);
  });
}
// Khôi phục nháp đã lưu (nếu có) vào các field tương ứng; trả về true nếu có khôi phục dữ liệu.
function restoreDraftIntoFields(key, fieldIds){
  const draft = loadDraftData(key);
  if(!draft) return false;
  let restored = false;
  fieldIds.forEach(id=>{
    const el = document.getElementById(id);
    if(el && draft[id] !== undefined && draft[id] !== '' && draft[id] !== el.value){ el.value = draft[id]; restored = true; }
  });
  return restored;
}
// Rung nhẹ khung modal để báo cho người dùng biết bấm ra ngoài không đóng cửa sổ (tránh mất dữ liệu
// đang nhập dở do lỡ tay bấm ra ngoài) — họ cần bấm nút X hoặc Huỷ để đóng.
function nudgeModal(overlay){
  const card = overlay.querySelector('.modal');
  if(!card) return;
  card.classList.remove('modal-shake');
  void card.offsetWidth;
  card.classList.add('modal-shake');
  setTimeout(()=>card.classList.remove('modal-shake'), 350);
}

/* ------------------------------ Confirm modal ------------------------------ */
function askConfirm(message, onYes){
  State.confirmState = { message, onYes };
  renderModals();
}
function closeConfirm(){ State.confirmState=null; renderModals(); }

/* ================================ RENDER ================================== */
function render(){
  const app = document.getElementById('app');
  if(!State.session || !State.profile){
    app.innerHTML = viewLogin();
    bindLogin();
    renderModals();
    return;
  }
  if(!State.profile.is_admin && State.profile.approved===false){
    app.innerHTML = viewPendingApproval();
    bindPendingApproval();
    renderModals();
    return;
  }
  app.innerHTML = viewShell();
  bindShell();
  renderModals();
}

function renderModals(){
  const root = document.getElementById('modal-root');
  let html = '';
  if(State.openTaskId) html += viewTaskModal();
  if(State.showNewProject) html += viewNewProjectModal();
  if(State.showNewTask) html += viewNewTaskModal();
  if(State.showChangePassword) html += viewChangePasswordModal();
  if(State.confirmState) html += viewConfirmModal();
  root.innerHTML = html;
  bindModals();
}

  if(sel) sel.addEventListener('change', ()=> updateProject(p.id, { status: sel.value }));

  document.querySelectorAll('[data-pd-member-role]').forEach(s=>s.addEventListener('change',()=> updateMemberRole(p.id, s.dataset.pdMemberRole, s.value)));
  document.querySelectorAll('[data-pd-approve-admin]').forEach(b=>b.addEventListener('click',()=> approveProjectAdmin(p.id, b.dataset.pdApproveAdmin)));
  document.querySelectorAll('[data-pd-remove]').forEach(b=>b.addEventListener('click',()=>{
    const pr = profileById(b.dataset.pdRemove);
    askConfirm(`Loại "${pr?pr.full_name:''}" khỏi dự án? Lịch sử công việc của người này vẫn được giữ lại để tra cứu.`, ()=>softRemoveMember(p.id, b.dataset.pdRemove));

  document.querySelectorAll('[data-pd-restore]').forEach(b=>b.addEventListener('click',()=> restoreMember(p.id, b.dataset.pdRestore)));

/* ---------------------------------- Gantt ------------------------------------ */
function ganttRange(p){
  const tasks = tasksOfProject(p.id);
  let dates = [];
  tasks.forEach(t=>{ if(t.start_date) dates.push(t.start_date); if(t.due_date) dates.push(t.due_date); });
  if(p.start_date) dates.push(p.start_date);
  if(p.due_date) dates.push(p.due_date);
  if(!dates.length) dates=[todayStr()];
  let min = dates.reduce((a,b)=> a<b?a:b);
  let max = dates.reduce((a,b)=> a>b?a:b);
  const minD = parseDate(min); minD.setDate(minD.getDate()-4);
  const maxD = parseDate(max); maxD.setDate(maxD.getDate()+4);
  return { min:minD, max:maxD };
}
function pctOf(dateObj, range){
  const total = daysBetween(range.min, range.max) || 1;
  const off = daysBetween(range.min, dateObj);
  return Math.max(0, Math.min(100, off/total*100));
}
function monthHeaders(range){
  const months = [];
  let cur = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
  const totalDays = daysBetween(range.min, range.max) || 1;
  while(cur <= range.max){
    const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const segStart = cur < range.min ? range.min : cur;
    const segEnd = next > range.max ? range.max : next;
    const width = Math.max(0, daysBetween(segStart, segEnd)) / totalDays * 100;
    months.push({ label:`Th${cur.getMonth()+1}/${cur.getFullYear()}`, width });
    cur = next;
  }
  return months;
}
function ganttBarRow(t, p, range, depth){
  const kids = childTasks(t.id);
  const start = t.start_date ? parseDate(t.start_date) : (t.due_date ? (()=>{ const d=parseDate(t.due_date); d.setDate(d.getDate()-3); return d; })() : null);
  const end = t.due_date ? parseDate(t.due_date) : start;
  const meta = TASK_STATUS[t.status];
  const overdue = isOverdue(t);
  let barHtml = '';
  if(start && end){
    const left = pctOf(start, range);
    const width = Math.max(1, pctOf(end, range) - left);
    barHtml = `<div class="gantt-bar ${overdue?'overdue-glow':''}" style="left:${left}%;width:${width}%;background:${meta.fill};" data-open-task="${t.id}" title="${escapeHtml(t.title)}${overdue?' — TRỄ HẠN':''}">${overdue?'&#9888; ':''}${escapeHtml(t.title)}</div>`;
  }
  let rows = `<div class="gantt-row">
    <div class="gantt-row-label ${depth>0?'sub':''}" style="padding-left:${10+depth*16}px;${overdue?'color:var(--critical);font-weight:800;':''}">${overdue?'&#9888; ':''}${escapeHtml(t.title)}</div>
    <div class="gantt-track">${barHtml}</div>
  </div>`;
  kids.forEach(k=> rows += ganttBarRow(k, p, range, depth+1));
  return rows;
}
function viewGantt(p){
  const range = ganttRange(p);
  const top = topTasks(p.id);
  const todayPct = pctOf(parseDate(todayStr()), range);
  const months = monthHeaders(range);
  if(!top.length) return `<div class="card empty-hint">Chưa có công việc để hiển thị Gantt.</div>`;
  return `<div class="gantt-scroll"><div class="gantt-grid">
    <div class="gantt-header"><div style="width:230px;flex:0 0 230px;"></div>${months.map(m=>`<div class="gantt-month" style="width:${m.width}%;">${m.label}</div>`).join('')}</div>
    <div class="gantt-body">
      <div class="gantt-today" style="left:calc(230px + (100% - 230px) * ${todayPct}/100);"><div class="gantt-today-label">Hôm nay</div></div>
      ${top.map(t=>ganttBarRow(t,p,range,0)).join('')}
    </div>
  </div></div>`;
}

/* ---------------------------------- Stats ------------------------------------- */
// Weekly cumulative "planned vs actual" buckets for the trend chart. There is no
// historical snapshot table, so this approximates: "planned" = tasks whose due_date
// had passed by that week; "actual" = tasks marked done/completed whose updated_at
// (proxy for completion date) fell on/before that week.
function trendBuckets(tasks){
  const today = parseDate(todayStr());
  let minDate = new Date(today);
  tasks.forEach(t=>{
    const sd = t.start_date ? parseDate(t.start_date) : (t.created_at ? new Date(t.created_at) : null);
    if(sd && sd < minDate) minDate = sd;
  });
  const maxBack = new Date(today); maxBack.setDate(maxBack.getDate()-7*7);
  if(minDate < maxBack) minDate = maxBack;
  const start = new Date(minDate.getFullYear(), minDate.getMonth(), minDate.getDate());
  const dow = (start.getDay()+6)%7; // Monday-aligned
  start.setDate(start.getDate()-dow);
  const buckets = [];
  let cur = new Date(start);
  while(cur <= today){ buckets.push(new Date(cur)); cur = new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7); }
  if(!buckets.length || daysBetween(buckets[buckets.length-1], today)!==0) buckets.push(new Date(today));
  const capped = buckets.slice(-8);
  return capped.map(d=>{
    const dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const planned = tasks.filter(t=>t.due_date && t.due_date<=dateStr).length;
    const actual = tasks.filter(t=> isDoneItem(t) && t.updated_at && t.updated_at.slice(0,10)<=dateStr).length;
    return { date:d, dateStr, planned, actual };
  });
}
function renderTrendChart(buckets){
  if(buckets.length<2) return `<div class="empty-hint">Chưa đủ dữ liệu để vẽ biểu đồ xu hướng.</div>`;
  const W=680,H=220,padL=30,padR=44,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const maxVal = Math.max(1, ...buckets.map(b=>Math.max(b.planned,b.actual)));
  const niceMax = Math.max(5, Math.ceil(maxVal/5)*5);
  const n = buckets.length;
  const xStep = n>1 ? plotW/(n-1) : 0;
  const xAt = i => padL + i*xStep;
  const yAt = v => padT + plotH - (v/niceMax)*plotH;
  const gridlines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH*(1-f); const val = Math.round(niceMax*f);
    return `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-8}" y="${y+4}" font-size="10" fill="var(--muted)" text-anchor="end">${val}</text>`;
  }).join('');
  const plannedPts = buckets.map((b,i)=>`${xAt(i)},${yAt(b.planned)}`).join(' ');
  const actualPts = buckets.map((b,i)=>`${xAt(i)},${yAt(b.actual)}`).join(' ');
  const areaPts = `${xAt(0)},${yAt(0)} ${actualPts} ${xAt(n-1)},${yAt(0)}`;
  const showEvery = Math.max(1, Math.ceil(n/7));
  const xLabels = buckets.map((b,i)=> (i%showEvery===0 || i===n-1) ? `<text x="${xAt(i)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${pad(b.date.getDate())}/${pad(b.date.getMonth()+1)}</text>` : '').join('');
  const li = n-1;
  let yPlanned = yAt(buckets[li].planned), yActual = yAt(buckets[li].actual);
  if(Math.abs(yPlanned-yActual) < 12){ if(yPlanned<=yActual){ yPlanned-=7; yActual+=7; } else { yPlanned+=7; yActual-=7; } }
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:220px;display:block;" role="img" aria-label="Biểu đồ xu hướng tiến độ theo thời gian">
    ${gridlines}
    <polygon points="${areaPts}" fill="var(--good)" opacity="0.10"/>
    <polyline points="${plannedPts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="${actualPts}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xAt(li)}" cy="${yAt(buckets[li].planned)}" r="4" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${xAt(li)}" cy="${yAt(buckets[li].actual)}" r="4" fill="var(--good)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${xAt(li)+8}" y="${yPlanned+4}" font-size="11" font-weight="700" fill="var(--text)">${buckets[li].planned}</text>
    <text x="${xAt(li)+8}" y="${yActual+4}" font-size="11" font-weight="700" fill="var(--text)">${buckets[li].actual}</text>
    ${xLabels}
  </svg>`;
}

          return `<div class="barrow"><div class="barrow-label"><span class="dot" style="background:${v.color}"></span>${v.label}</div><div class="barrow-track"><div class="barrow-fill" style="width:${pct}%;background:${v.fill}"></div></div><div class="barrow-value">${c}</div></div>`;

            <td class="num">${count}</td>

function bindStats(){
  document.querySelectorAll('[data-open-project]').forEach(el=>el.addEventListener('click',()=>{ State.projectId=el.dataset.openProject; State.projectTab='list'; State.view='project'; render(); }));

/* ---------------------------------- Admin -------------------------------------- */
function pendingAdminGrants(){
  return State.allMembers.filter(m=>m.role==='admin' && !m.admin_approved && !m.removed_at);
}
// Newly self-registered accounts waiting on an Administrator to admit them into the system.
function pendingSignups(){
  return State.profiles.filter(pr=>!pr.is_admin && !pr.approved).sort((a,b)=> (a.created_at<b.created_at?-1:1));
}
function viewAdmin(){
  const pendingCount = pendingAdminGrants().length;
  const signupCount = pendingSignups().length;
  return `

      <div class="members-row" style="flex-wrap:wrap;">
        <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${avatarColor(pr.id)}">${initials(pr.full_name)}</div>
        <div style="flex:1 1 200px;min-width:0;">
          <div class="name" style="${pr.disabled?'color:var(--critical);text-decoration:line-through;':''}">${escapeHtml(pr.full_name)}</div>

        ${pr.disabled ? `<span class="badge" style="font-size:10px;background:#d03b3b18;color:var(--critical);">Đã vô hiệu hoá</span>` : ''}
        ${!pr.approved ? `<button class="btn btn-sm" style="color:var(--good);border-color:var(--good);" data-signup-approve="${pr.id}">Duyệt</button>` : ''}
        <button class="btn btn-sm" data-change-password="${pr.id}">Đổi mật khẩu</button>
        <span style="font-size:11px;color:var(--muted);">Vô hiệu hoá</span>
        <button class="toggle ${pr.disabled?'on':''}" style="background:${pr.disabled?'var(--critical)':''}" data-toggle-disabled="${pr.id}"><span class="knob"></span></button>
        <span style="font-size:11px;color:var(--muted);margin-left:8px;">Quản trị hệ thống</span>

          <select class="role-select" data-member-role="${m.user_id}">

          <button class="icon-btn" data-remove-member="${m.user_id}" title="Loại khỏi dự án">&#128465;</button>

      ${removed.length ? `<div class="modal-sec-title">Đã rời dự án</div>${removed.map(m=>{ const pr=profileById(m.user_id); return `

      <div class="modal-sec-title">Thêm thành viên</div>
      <div style="display:flex;gap:8px;">
        <select id="add-member-select" style="flex:1;">
          ${nonMembers.map(pr=>`<option value="${pr.id}">${escapeHtml(pr.full_name)} (${escapeHtml(pr.email)})</option>`).join('') || '<option value="">Không còn người dùng nào</option>'}
        </select>

function bindAdmin(){
  document.querySelectorAll('[data-atab]').forEach(b=>b.addEventListener('click',()=>{ State.adminTab=b.dataset.atab; render(); }));
  if(State.adminTab==='users'){
    document.querySelectorAll('[data-toggle-admin]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.toggleAdmin; const pr=profileById(id);
      askConfirm(`Cấp quyền Administrator (toàn quyền hệ thống) cho "${pr.full_name}"?`, ()=>toggleAdmin(id, !pr.is_admin));
    }));
    document.querySelectorAll('[data-toggle-disabled]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.toggleDisabled; const pr=profileById(id); setUserDisabled(id, !pr.disabled);
    }));
    document.querySelectorAll('[data-signup-approve]').forEach(b=>b.addEventListener('click',()=> approveSignup(b.dataset.signupApprove)));
    document.querySelectorAll('[data-change-password]').forEach(b=>b.addEventListener('click',()=>{
      State.showChangePassword = b.dataset.changePassword; State.pwError=null; renderModals();
    }));
    document.querySelectorAll('[data-delete-user]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.deleteUser; const pr=profileById(id);
      askConfirm(`Xoá vĩnh viễn tài khoản "${pr?pr.full_name:''}" (${pr?pr.email:''})? Người này sẽ không đăng nhập được nữa. Nếu tài khoản đã có dữ liệu dự án/công việc, hệ thống sẽ từ chối xoá — hãy dùng Vô hiệu hoá thay thế trong trường hợp đó.`, ()=>adminDeleteUser(id));
    }));
  }
  if(State.adminTab==='approvals'){
    document.querySelectorAll('[data-appr-approve]').forEach(b=>b.addEventListener('click',()=>{ const [pid,uid]=b.dataset.apprApprove.split('|'); approveProjectAdmin(pid,uid); }));
    document.querySelectorAll('[data-appr-reject]').forEach(b=>b.addEventListener('click',()=>{ const [pid,uid]=b.dataset.apprReject.split('|'); askConfirm('Từ chối quyền Quản trị dự án? Người này sẽ được hạ xuống Biên tập viên.', ()=>rejectProjectAdmin(pid,uid)); }));
  }
  if(State.adminTab==='perms'){
    const sel = document.getElementById('admin-project-select');
    if(sel){ State.adminSelectedProject = sel.value; sel.addEventListener('change',()=>{ State.adminSelectedProject=sel.value; render(); }); }
    document.querySelectorAll('[data-member-role]').forEach(s=>s.addEventListener('change',()=> updateMemberRole(State.adminSelectedProject, s.dataset.memberRole, s.value)));
    document.querySelectorAll('[data-appr-approve]').forEach(b=>b.addEventListener('click',()=>{ const [pid,uid]=b.dataset.apprApprove.split('|'); approveProjectAdmin(pid,uid); }));
    document.querySelectorAll('[data-remove-member]').forEach(b=>b.addEventListener('click',()=> askConfirm('Loại thành viên này khỏi dự án? Lịch sử công việc vẫn được giữ lại.', ()=>softRemoveMember(State.adminSelectedProject, b.dataset.removeMember))));
    document.querySelectorAll('[data-restore-member]').forEach(b=>b.addEventListener('click',()=> restoreMember(State.adminSelectedProject, b.dataset.restoreMember)));
    const addBtn = document.getElementById('add-member-btn');
    if(addBtn) addBtn.addEventListener('click',()=>{
      const uSel=document.getElementById('add-member-select'), rSel=document.getElementById('add-member-role');
      if(uSel.value) addMember(State.adminSelectedProject, uSel.value, rSel.value);
    });
    const delBtn = document.getElementById('delete-project-btn');
    if(delBtn) delBtn.addEventListener('click',()=> askConfirm('Xoá vĩnh viễn dự án này cùng toàn bộ dữ liệu liên quan?', ()=>{
      deleteProject(State.adminSelectedProject); State.adminSelectedProject=null;
    }));
  }
}

/* ------------------------------- Task detail modal ------------------------------- */
function viewTaskModal(){
  const t = taskById(State.openTaskId);
  if(!t) return '';
  const p = projectById(t.project_id);
  const locked = t.approval_status==='approved';
  const baseEditable = canEdit(p.id);
  const contentEditable = baseEditable && !locked;
  const datesEditable = canEditDates(p.id) && !locked;
  const showApprove = canApprove(p.id);
  const canDeleteTask = baseEditable && (!locked || isGlobalAdmin());
  const showSave = contentEditable || datesEditable;
  const members = visibleMembers(p.id);
  const comments = commentsOfTask(t.id);
  const parent = t.parent_task_id ? taskById(t.parent_task_id) : null;
  const kids = childTasks(t.id);
  const { depth: tDepth, idx1: tIdx1 } = taskPositionInfo(t);
  return `<div class="overlay" id="task-modal-overlay">
    <div class="card modal">
      <div class="modal-head">
        <div>
          <h2>${locked?'&#128274; ':''}${parent ? `<span style="color:var(--muted);font-weight:500;">${escapeHtml(parent.title)} &rsaquo;</span> ` : ''}<span class="task-order-label">${taskOrderLabel(tDepth, tIdx1)}</span>${escapeHtml(t.title)}</h2>
          <div class="crumb" style="font-size:11.5px;color:var(--muted);">${escapeHtml(p.name)}</div>
        </div>
        <button class="modal-close" id="close-task-modal">&times;</button>
      </div>
      ${locked ? `<div class="err-box" style="background:#0ca30c12;border-color:#0ca30c44;color:var(--good);">Công việc này đã được phê duyệt và <b>khoá cứng</b> — không thể chỉnh sửa nội dung cho đến khi được mở khoá (huỷ phê duyệt).</div>` : ''}
      ${!locked && !baseEditable ? `<div class="err-box" style="background:var(--page);border-color:var(--border);color:var(--text-2);">Bạn chỉ có quyền xem công việc này.</div>` : ''}

      <div class="field">
        <label class="field-label">Tên công việc</label>
        <input type="text" id="tm-title" value="${escapeHtml(t.title)}" ${contentEditable?'':'disabled'}>
      </div>
      <div class="field">
        <label class="field-label">Mô tả chi tiết</label>
        <textarea id="tm-desc" rows="3" ${contentEditable?'':'disabled'}>${escapeHtml(t.description||'')}</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Người phụ trách chính</label>
          <select id="tm-assignee" ${contentEditable?'':'disabled'}>
            <option value="">— Chưa gán —</option>
            ${members.map(m=>{ const pr=profileById(m.user_id); return `<option value="${m.user_id}" ${t.assignee_id===m.user_id?'selected':''}>${escapeHtml(pr?pr.full_name:'')}</option>`; }).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Trạng thái</label>
          <select id="tm-status" ${contentEditable?'':'disabled'}>${Object.entries(TASK_STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v.label}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Ngày bắt đầu</label>
          <input type="date" id="tm-start" value="${t.start_date||''}" ${datesEditable?'':'disabled'}>
        </div>
        <div class="field">
          <label class="field-label">Thời gian hoàn thành (hạn)</label>
          <input type="date" id="tm-due" value="${t.due_date||''}" ${datesEditable?'':'disabled'}>
        </div>
      </div>
      ${!datesEditable && !locked ? `<div style="font-size:11.5px;color:var(--muted);margin:-8px 0 14px;">Chỉ Quản trị dự án mới chỉnh được thời gian sau khi đã lưu. Muốn đổi ngày, hãy báo Quản trị dự án.</div>` : ''}
      <div class="field-row">
        <div class="field">
          <label class="field-label">Mức ưu tiên</label>
          <select id="tm-priority" ${contentEditable?'':'disabled'}>${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${t.priority===k?'selected':''}>${v.label}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label class="field-label">Phê duyệt</label>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <span class="badge" style="background:${APPROVAL[t.approval_status].color}18;color:${APPROVAL[t.approval_status].color}">${APPROVAL[t.approval_status].label}</span>
            ${showApprove ? `
              <button class="btn btn-sm" data-approve="approved" style="color:var(--good);border-color:var(--good);" ${locked?'disabled':''}>Duyệt</button>
              <button class="btn btn-sm" data-approve="rejected" style="color:var(--critical);border-color:var(--critical);">Từ chối</button>
              <button class="btn btn-sm" data-approve="pending">Chờ duyệt</button>
            ` : `<span style="font-size:11px;color:var(--muted);">Chỉ quyền Phê duyệt (Tổng Giám Đốc) hoặc Administrator</span>`}
          </div>
        </div>
      </div>

      ${kids.length ? `<div class="modal-sec-title">Công việc con (${kids.length})</div>${kids.map(k=>`<div class="task-row" style="padding:8px 0;" data-open-task="${k.id}"><span style="flex:1;font-size:13px;cursor:pointer;">${k.approval_status==='approved'?'&#128274; ':''}${escapeHtml(k.title)}</span><span class="badge" style="background:${TASK_STATUS[k.status].color}18;color:${TASK_STATUS[k.status].color}">${TASK_STATUS[k.status].label}</span></div>`).join('')}` : ''}

      <div class="modal-sec-title">Ý kiến phản hồi (${comments.length})</div>
      <div style="max-height:220px;overflow-y:auto;">
        ${comments.map(c=>{ const author=profileById(c.author_id); return `<div class="comment-item">
          <div class="comment-head"><div class="avatar" style="width:20px;height:20px;font-size:9px;background:${avatarColor(c.author_id)}">${initials(author?author.full_name:'?')}</div>${escapeHtml(author?author.full_name:'Ẩn danh')}<span class="comment-time">${fmtDateTime(c.created_at)}</span>
            ${(c.author_id===State.profile.id || isGlobalAdmin()) ? `<button class="icon-btn" style="margin-left:auto;" data-del-comment="${c.id}">&#128465;</button>` : ''}
          </div>
          <div class="comment-body">${nl2br(c.content)}</div>
        </div>`; }).join('') || '<div style="font-size:12.5px;color:var(--muted);padding:8px 0;">Chưa có phản hồi nào.</div>'}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <textarea id="tm-comment" rows="2" placeholder="Viết ý kiến phản hồi…" style="flex:1;"></textarea>
        <button class="btn btn-primary btn-sm" id="tm-send-comment" style="align-self:flex-end;">Gửi</button>
      </div>

      <div class="modal-actions">
        ${canDeleteTask ? `<button class="btn btn-danger" id="tm-delete">Xoá công việc</button>` : ''}
        <div class="spacer"></div>
        <button class="btn" id="tm-cancel">Đóng</button>
        ${showSave ? `<button class="btn btn-primary" id="tm-save">Lưu thay đổi</button>` : ''}
      </div>
    </div>
  </div>`;
}
function bindModals(){
  bindTaskModal();
  bindNewProjectModal();
  bindNewTaskModal();
  bindChangePasswordModal();
  bindConfirmModal();
}
function bindTaskModal(){
  const overlay = document.getElementById('task-modal-overlay');
  if(!overlay) return;
  const t = taskById(State.openTaskId);
  const dKey = draftKey('task', t.id);
  const cKey = draftKey('comment', t.id);
  const close = ()=>{ clearDraft(dKey); State.openTaskId=null; renderModals(); };
  // Bấm ra ngoài cửa sổ không tự đóng nữa (tránh mất nội dung đang nhập dở do lỡ tay) —
  // chỉ rung nhẹ để nhắc người dùng bấm nút X hoặc "Đóng" nếu thực sự muốn thoát.
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) nudgeModal(overlay); });
  document.getElementById('close-task-modal').addEventListener('click', close);
  document.getElementById('tm-cancel').addEventListener('click', close);
  document.querySelectorAll('[data-open-task]').forEach(el=>el.addEventListener('click',()=>{ State.openTaskId=el.dataset.openTask; renderModals(); }));

  // Khôi phục & tự lưu nháp cho các field đang được phép chỉnh sửa — chống mất dữ liệu nếu
  // trình duyệt tải lại trang do mở tab khác (xem ghi chú tại wireDraftAutosave).
  const editableFieldIds = ['tm-title','tm-desc','tm-assignee','tm-status','tm-start','tm-due','tm-priority']
    .filter(id=>{ const el=document.getElementById(id); return el && !el.disabled; });
  if(editableFieldIds.length){
    if(restoreDraftIntoFields(dKey, editableFieldIds)) toast('Đã khôi phục nội dung đang nhập dở trước đó');
    wireDraftAutosave(dKey, editableFieldIds);
  }
  restoreDraftIntoFields(cKey, ['tm-comment']);
  wireDraftAutosave(cKey, ['tm-comment']);

  const save = document.getElementById('tm-save');
  if(save) save.addEventListener('click', async ()=>{
    const patch = {
      title: document.getElementById('tm-title').value.trim() || t.title,
      description: document.getElementById('tm-desc').value,
      assignee_id: document.getElementById('tm-assignee').value || null,
      status: document.getElementById('tm-status').value,
      start_date: document.getElementById('tm-start').value || null,
      due_date: document.getElementById('tm-due').value || null,
      priority: document.getElementById('tm-priority').value,
    };
    const ok = await updateTask(t.id, patch);
    if(ok){ clearDraft(dKey); State.openTaskId=null; }
    renderModals();
  });
  const del = document.getElementById('tm-delete');
  if(del) del.addEventListener('click', ()=>{
    askConfirm(`Xoá công việc "${t.title}"? Mọi công việc con và phản hồi liên quan cũng sẽ bị xoá.`, async ()=>{ clearDraft(dKey); clearDraft(cKey); await deleteTask(t.id); State.openTaskId=null; render(); });
  });
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', ()=> setApprovalStatus(t.id, b.dataset.approve).then(renderModals)));
  const sendBtn = document.getElementById('tm-send-comment');
  if(sendBtn) sendBtn.addEventListener('click', async ()=>{
    const ta = document.getElementById('tm-comment');
    if(!ta.value.trim()) return;
    await addComment(t.id, ta.value);
    clearDraft(cKey);
    renderModals();
  });
  document.querySelectorAll('[data-del-comment]').forEach(b=>b.addEventListener('click', ()=> askConfirm('Xoá phản hồi này?', ()=>deleteComment(b.dataset.delComment).then(renderModals))));
}

/* ------------------------------- New project modal -------------------------------- */
function viewNewProjectModal(){
  return `<div class="overlay" id="np-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>Tạo dự án mới</h2><button class="modal-close" id="np-close">&times;</button></div>
      <div class="field"><label class="field-label">Tên dự án</label><input type="text" id="np-name" placeholder="VD: Ra mắt sản phẩm X"></div>
      <div class="field"><label class="field-label">Mô tả</label><textarea id="np-desc" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label class="field-label">Ngày bắt đầu</label><input type="date" id="np-start"></div>
        <div class="field"><label class="field-label">Hạn hoàn thành</label><input type="date" id="np-due"></div>
      </div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="np-cancel">Huỷ</button>
        <button class="btn btn-primary" id="np-create">Tạo dự án</button>
      </div>
    </div>
  </div>`;
}
function bindNewProjectModal(){
  const overlay = document.getElementById('np-overlay');
  if(!overlay) return;
  const dKey = draftKey('newproject', 'x');
  const close = ()=>{ clearDraft(dKey); State.showNewProject=false; renderModals(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) nudgeModal(overlay); });
  document.getElementById('np-close').addEventListener('click', close);
  document.getElementById('np-cancel').addEventListener('click', close);
  const fieldIds = ['np-name','np-desc','np-start','np-due'];
  if(restoreDraftIntoFields(dKey, fieldIds)) toast('Đã khôi phục nội dung đang nhập dở trước đó');
  wireDraftAutosave(dKey, fieldIds);
  document.getElementById('np-create').addEventListener('click', async ()=>{
    const name = document.getElementById('np-name').value.trim();
    if(!name){ toast('Vui lòng nhập tên dự án', true); return; }
    const payload = {
      name, description: document.getElementById('np-desc').value,
      start_date: document.getElementById('np-start').value || null,
      due_date: document.getElementById('np-due').value || null,
      status: 'planning',
    };
    State.showNewProject=false;
    clearDraft(dKey);
    await createProject(payload);
  });
}

/* --------------------------------- New task modal ---------------------------------- */
function viewNewTaskModal(){
  const { projectId, parentId } = State.showNewTask;
  const p = projectById(projectId);
  const members = visibleMembers(projectId);
  const parent = parentId ? taskById(parentId) : null;
  return `<div class="overlay" id="nt-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>${parent ? 'Thêm công việc con' : 'Thêm công việc lớn'}</h2><button class="modal-close" id="nt-close">&times;</button></div>
      ${parent ? `<div class="crumb" style="margin-bottom:10px;">Thuộc: ${escapeHtml(parent.title)}</div>` : ''}
      <div class="field"><label class="field-label">Tên công việc</label><input type="text" id="nt-title" placeholder="Nhập nội dung công việc"></div>
      <div class="field"><label class="field-label">Mô tả chi tiết</label><textarea id="nt-desc" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label class="field-label">Người phụ trách</label><select id="nt-assignee"><option value="">— Chưa gán —</option>${members.map(m=>{ const pr=profileById(m.user_id); return `<option value="${m.user_id}">${escapeHtml(pr?pr.full_name:'')}</option>`; }).join('')}</select></div>
        <div class="field"><label class="field-label">Mức ưu tiên</label><select id="nt-priority">${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${k==='medium'?'selected':''}>${v.label}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Ngày bắt đầu</label><input type="date" id="nt-start"></div>
        <div class="field"><label class="field-label">Hạn hoàn thành</label><input type="date" id="nt-due"></div>
      </div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="nt-cancel">Huỷ</button>
        <button class="btn btn-primary" id="nt-create">Thêm công việc</button>
      </div>
    </div>
  </div>`;
}
function bindNewTaskModal(){
  const overlay = document.getElementById('nt-overlay');
  if(!overlay) return;
  const { projectId, parentId } = State.showNewTask;
  const dKey = draftKey('newtask', projectId + '_' + (parentId || 'top'));
  const close = ()=>{ clearDraft(dKey); State.showNewTask=null; renderModals(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) nudgeModal(overlay); });
  document.getElementById('nt-close').addEventListener('click', close);
  document.getElementById('nt-cancel').addEventListener('click', close);
  const fieldIds = ['nt-title','nt-desc','nt-assignee','nt-priority','nt-start','nt-due'];
  if(restoreDraftIntoFields(dKey, fieldIds)) toast('Đã khôi phục nội dung đang nhập dở trước đó');
  wireDraftAutosave(dKey, fieldIds);
  document.getElementById('nt-create').addEventListener('click', async ()=>{
    const title = document.getElementById('nt-title').value.trim();
    if(!title){ toast('Vui lòng nhập tên công việc', true); return; }
    const payload = {
      project_id: projectId, parent_task_id: parentId,
      title, description: document.getElementById('nt-desc').value,
      assignee_id: document.getElementById('nt-assignee').value || null,
      priority: document.getElementById('nt-priority').value,
      start_date: document.getElementById('nt-start').value || null,
      due_date: document.getElementById('nt-due').value || null,
    };
    State.showNewTask=null;
    clearDraft(dKey);
    if(parentId) State.expanded[parentId]=true;
    await createTask(payload);
  });
}

/* ------------------------------- Change password modal -------------------------------- */
function viewChangePasswordModal(){
  const pr = profileById(State.showChangePassword);
  return `<div class="overlay" id="pw-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>Đổi mật khẩu</h2><button class="modal-close" id="pw-close">&times;</button></div>
      <p style="font-size:12.5px;color:var(--text-2);margin-top:-8px;">Đặt mật khẩu mới cho <b>${escapeHtml(pr?pr.full_name:'')}</b> (${escapeHtml(pr?pr.email:'')}). Hãy báo mật khẩu mới cho người này sau khi đổi.</p>
      ${State.pwError ? `<div class="err-box">${escapeHtml(State.pwError)}</div>` : ''}
      <div class="field"><label class="field-label">Mật khẩu mới</label><input type="text" id="pw-new" placeholder="Tối thiểu 6 ký tự" autocomplete="off"></div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="pw-cancel">Huỷ</button>
        <button class="btn btn-primary" id="pw-save" ${State.pwBusy?'disabled':''}>${State.pwBusy?'Đang lưu…':'Đổi mật khẩu'}</button>
      </div>
    </div>
  </div>`;
}
function bindChangePasswordModal(){
  const overlay = document.getElementById('pw-overlay');
  if(!overlay) return;
  const close = ()=>{ State.showChangePassword=null; State.pwError=null; renderModals(); };
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) nudgeModal(overlay); });
  document.getElementById('pw-close').addEventListener('click', close);
  document.getElementById('pw-cancel').addEventListener('click', close);
  document.getElementById('pw-save').addEventListener('click', async ()=>{
    const val = document.getElementById('pw-new').value;
    if(!val || val.length<6){ State.pwError='Mật khẩu mới phải có ít nhất 6 ký tự.'; renderModals(); return; }
    State.pwBusy=true; State.pwError=null; renderModals();
    const ok = await adminSetPassword(State.showChangePassword, val);
    State.pwBusy=false;
    if(!ok) renderModals();
  });
}

/* ----------------------------------- Confirm modal ------------------------------------ */
function viewConfirmModal(){
  return `<div class="overlay" id="cf-overlay">
    <div class="card modal modal-sm">
      <div class="modal-head"><h2>Xác nhận</h2></div>
      <p style="font-size:13.5px;color:var(--text-2);line-height:1.6;">${escapeHtml(State.confirmState.message)}</p>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn" id="cf-no">Huỷ</button>
        <button class="btn btn-danger" id="cf-yes">Xác nhận</button>
      </div>
    </div>
  </div>`;
}
function bindConfirmModal(){
  const overlay = document.getElementById('cf-overlay');
  if(!overlay) return;
  const { onYes } = State.confirmState;
  document.getElementById('cf-no').addEventListener('click', closeConfirm);
  document.getElementById('cf-yes').addEventListener('click', async ()=>{ closeConfirm(); await onYes(); });
}

/* -------------------------------------- Boot --------------------------------------- */
(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  State.session = session;
  if(session){ await afterLogin(); } else { render(); }
})();
</script>
